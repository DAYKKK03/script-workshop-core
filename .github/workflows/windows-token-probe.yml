name: Windows restricted token probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Check restricted process launch
        shell: pwsh
        run: |
          runas.exe /showtrustlevels
          $output = Join-Path $env:RUNNER_TEMP 'restricted-whoami.txt'
          $command = 'cmd.exe /c whoami /groups > "' + $output + '"'
          runas.exe /trustlevel:0x20000 $command
          for ($i = 0; $i -lt 20 -and -not (Test-Path $output); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $output)) { throw 'Restricted process did not write output' }
          Get-Content $output
