name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run test:desktop
        if: matrix.platform == 'mac'
        env:
          SCRIPT_WORKSHOP_DEBUG_POSTGRES: "1"
      - name: Test desktop under a standard Windows token
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/windows-restricted-run.ps1 test
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Smoke-test packaged Electron app
        if: matrix.platform == 'mac'
        run: node scripts/smoke-packaged-desktop.mjs
      - name: Smoke-test packaged Electron app under a standard Windows token
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/windows-restricted-run.ps1 smoke
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          node scripts/desktop-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
