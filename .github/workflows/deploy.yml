name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Staging deploy mode
        required: true
        default: standard
        type: choice
        options:
          - standard
          - ip-http

permissions: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: douyin_scripts_ci
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d douyin_scripts_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:ci-only@127.0.0.1:5432/douyin_scripts_ci?schema=public
      TEST_DATABASE_URL: postgresql://app:ci-only@127.0.0.1:5432/douyin_scripts_test?schema=public
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      ADMIN_MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DOUYIN_PROVIDER: blocked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create isolated integration database
        env:
          PGPASSWORD: ci-only
        run: psql -h 127.0.0.1 -U app -d douyin_scripts_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE douyin_scripts_test'
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run worker:topics:check
      - run: npm run worker:custom-scripts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate formal Caddy configuration
        run: |
          sed 's/{\$APP_DOMAIN}/staging.example.test/g; s/{\$EDGEONE_ORIGIN_SECRET}/fixture-secret/g' deploy/Caddyfile \
            | docker run --rm -i caddy:2.10-alpine caddy validate --config - --adapter caddyfile
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, Linux, X64, staging-hk]
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy locally with rollback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_ROOT: /opt/douyin-script
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'standard' }}
        run: sh ./deploy/self-hosted-deploy.sh "${{ github.sha }}"
