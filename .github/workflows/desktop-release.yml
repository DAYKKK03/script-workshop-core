name: Prepare desktop release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop packages workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source build result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          outcome=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.conclusion')
          test "$outcome" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.head_sha' > build-sha.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          pattern: desktop-*
          merge-multiple: true
          path: dist-desktop
      - name: Verify packages and write checksums
        run: |
          test "$(find dist-desktop -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find dist-desktop -maxdepth 1 -name '*.exe' | wc -l)" -ge 1
          node scripts/desktop-checksums.mjs
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cat build-sha.txt)
          gh release create v0.2.0 dist-desktop/*.dmg dist-desktop/*.exe dist-desktop/SHA256SUMS.txt \
            --target "$sha" --title '脚本工坊基础版 v0.2.0' \
            --notes-file docs/DESKTOP_RELEASE_NOTES.md --draft
