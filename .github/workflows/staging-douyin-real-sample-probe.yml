name: Staging Douyin real sample probe

on:
  workflow_dispatch:
    inputs:
      douyin_url:
        description: "Douyin URL to probe"
        required: true
        default: "https://v.douyin.com/RizWo4dMR6w/"

permissions: {}

concurrency:
  group: staging-douyin-real-sample-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, staging-hk]
    steps:
      - name: Probe deployed Douyin extraction chain from worker container
        shell: bash
        run: |
          set -euo pipefail

          deploy_root="/opt/douyin-script"
          compose_file="$deploy_root/compose.ip-http.yml"
          probe_file="${RUNNER_TEMP:-/tmp}/staging-douyin-real-sample-probe.ts"

          cd "$deploy_root"

          printf 'DEPLOYED_HEAD=%s\n' "$(cat .deployed-image-tag 2>/dev/null || printf 'missing')"
          docker compose -f "$compose_file" ps web worker

          cat > "$probe_file" <<'TS'
          import { createHash } from "node:crypto";
          import { setTimeout as sleep } from "node:timers/promises";
          import { prisma } from "/app/lib/prisma.ts";
          import {
            createExtractionJob,
            ExtractionJobError
          } from "/app/lib/douyin/extraction-jobs.ts";
          import { parseExtractionErrorCode } from "/app/lib/douyin/extraction-error-code.ts";
          import { isUsableReferenceTranscript } from "/app/lib/scripts/reference-transcript.ts";

          type TerminalStatus = "failed" | "succeeded";

          function hash8(value: string) {
            return createHash("sha256").update(value).digest("hex").slice(0, 8);
          }

          function transcriptBucket(value: string | null | undefined) {
            const length = value?.trim().length || 0;

            if (length === 0) return "none";
            if (length < 40) return "1-39";
            if (length < 100) return "40-99";
            if (length < 500) return "100-499";
            if (length < 2000) return "500-1999";
            return "2000+";
          }

          function classifyStage(status: TerminalStatus, baseCode: string | null) {
            if (status === "succeeded") {
              return {
                lastSuccessfulStage: "transcript_ready",
                failedStage: null,
                crossedCos: true,
                crossedAsrSubmit: true
              };
            }

            if (
              baseCode === "ASR_MEDIA_RELAY_NOT_CONFIGURED" ||
              baseCode === "ASR_MEDIA_RELAY_FAILED"
            ) {
              return {
                lastSuccessfulStage: "ffmpeg_audio_ready",
                failedStage: "cos_media_relay",
                crossedCos: false,
                crossedAsrSubmit: false
              };
            }

            if (baseCode === "ASR_SUBMIT_FAILED") {
              return {
                lastSuccessfulStage: "cos_media_relay_ready",
                failedStage: "asr_submit",
                crossedCos: true,
                crossedAsrSubmit: false
              };
            }

            if (
              baseCode === "ASR_QUERY_REQUEST_FAILED" ||
              baseCode === "ASR_QUERY_TIMEOUT" ||
              baseCode === "ASR_PROVIDER_REJECTED" ||
              baseCode === "ASR_TRANSCRIPTION_FAILED" ||
              baseCode === "ASR_NO_AUDIO_TRACK"
            ) {
              return {
                lastSuccessfulStage: "asr_submit_accepted",
                failedStage: "asr_query_or_result",
                crossedCos: true,
                crossedAsrSubmit: true
              };
            }

            return {
              lastSuccessfulStage: "douyin_provider_started",
              failedStage: baseCode || "unknown",
              crossedCos: null,
              crossedAsrSubmit: null
            };
          }

          async function createProbeJob(douyinUrl: string) {
            const users = await prisma.user.findMany({
              where: { status: "active" },
              orderBy: { createdAt: "asc" },
              select: { id: true },
              take: 20
            });

            if (users.length === 0) {
              return { status: "no_active_user" as const };
            }

            const originalInfo = console.info;
            const originalError = console.error;
            console.info = () => undefined;
            console.error = () => undefined;

            try {
              for (const user of users) {
                try {
                  const job = await createExtractionJob({
                    userId: user.id,
                    douyinUrl
                  });
                  return { status: "created" as const, jobId: job.id };
                } catch (error) {
                  if (
                    error instanceof ExtractionJobError &&
                    error.code === "EXTRACTION_CONCURRENCY_LIMIT"
                  ) {
                    continue;
                  }
                  throw error;
                }
              }
            } finally {
              console.info = originalInfo;
              console.error = originalError;
            }

            return { status: "concurrency_blocked" as const };
          }

          async function readJob(jobId: string) {
            return prisma.extractionJob.findUnique({
              where: { id: jobId },
              select: {
                id: true,
                sourceHost: true,
                sourceHash: true,
                sourceUrl: true,
                status: true,
                errorCode: true,
                transcript: true,
                attemptCount: true,
                maxAttempts: true,
                updatedAt: true
              }
            });
          }

          async function main() {
            const douyinUrl = process.env.PROBE_DOUYIN_URL;

            if (!douyinUrl) {
              console.log(JSON.stringify({ verdict: "missing_probe_input" }, null, 2));
              process.exit(2);
            }

            const created = await createProbeJob(douyinUrl);

            if (created.status !== "created") {
              console.log(JSON.stringify({ verdict: created.status }, null, 2));
              process.exit(created.status === "no_active_user" ? 3 : 4);
            }

            const deadline = Date.now() + 10 * 60 * 1000;
            let job = await readJob(created.jobId);

            while (
              job &&
              job.status !== "succeeded" &&
              job.status !== "failed" &&
              Date.now() < deadline
            ) {
              await sleep(5000);
              job = await readJob(created.jobId);
            }

            if (!job) {
              console.log(
                JSON.stringify(
                  {
                    verdict: "job_missing_after_create",
                    jobHash8: hash8(created.jobId)
                  },
                  null,
                  2
                )
              );
              process.exit(5);
            }

            const parsed = parseExtractionErrorCode(job.errorCode);
            const terminal = job.status === "succeeded" || job.status === "failed";
            const stage = terminal
              ? classifyStage(job.status, parsed.baseCode)
              : {
                  lastSuccessfulStage: "job_created",
                  failedStage: "timeout_waiting_for_terminal_status",
                  crossedCos: null,
                  crossedAsrSubmit: null
                };

            const result = {
              verdict: terminal ? job.status : "timeout",
              jobHash8: hash8(job.id),
              sourceHost: job.sourceHost,
              sourceHash8: job.sourceHash ? job.sourceHash.slice(0, 8) : null,
              sourceUrlPresent: Boolean(job.sourceUrl),
              status: job.status,
              errorBaseCode: parsed.baseCode,
              safeDetail: parsed.safeDetail,
              selectedMediaKind: parsed.selectedMediaKind,
              selectedMediaFormat: parsed.selectedMediaFormat,
              selectedMediaPath: parsed.selectedMediaPath,
              candidateCount: parsed.candidateCount,
              candidateKinds: parsed.candidateKinds,
              candidateFormats: parsed.candidateFormats,
              candidatePaths: parsed.candidatePaths,
              attemptCount: job.attemptCount,
              maxAttempts: job.maxAttempts,
              transcriptBucket: transcriptBucket(job.transcript),
              usableReferenceTranscript: isUsableReferenceTranscript(job.transcript),
              lastSuccessfulStage: stage.lastSuccessfulStage,
              failedStage: stage.failedStage,
              crossedCos: stage.crossedCos,
              crossedAsrSubmit: stage.crossedAsrSubmit
            };

            console.log(JSON.stringify(result, null, 2));
            process.exit(terminal && job.status === "succeeded" ? 0 : 6);
          }

          main()
            .catch((error) => {
              console.log(
                JSON.stringify(
                  {
                    verdict: "probe_exception",
                    errorName: error instanceof Error ? error.name : "unknown",
                    errorMessageBucket:
                      error instanceof Error && error.message
                        ? error.message.slice(0, 80)
                        : "none"
                  },
                  null,
                  2
                )
              );
              process.exit(10);
            })
            .finally(async () => {
              await prisma.$disconnect().catch(() => undefined);
            });
          TS

          docker compose -f "$compose_file" cp "$probe_file" worker:/tmp/staging-douyin-real-sample-probe.ts
          set +e
          docker compose -f "$compose_file" exec -T -e PROBE_DOUYIN_URL="${{ inputs.douyin_url }}" worker node --import tsx /tmp/staging-douyin-real-sample-probe.ts
          probe_status="$?"
          set -e
          docker compose -f "$compose_file" exec -T -u 0 worker rm -f /tmp/staging-douyin-real-sample-probe.ts >/dev/null 2>&1 || true
          exit "$probe_status"
