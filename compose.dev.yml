name: script-workshop-core-development

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: douyin_scripts
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d douyin_scripts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
